{# The city search bar (city_feed.py, static/js/citybar.js): search any city to see its feed, or use your
   location. On the stories page it sits under the brand bar and again in the pop-up bar that slides down
   when you scroll, so it's always at the top. #}
<div class="citybar" data-citybar>
  <form class="citybar__form" action="/" method="get" role="search" autocomplete="off">
    <svg class="citybar__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <input class="citybar__input" type="search" name="city" placeholder="Search any city" aria-label="Search any city"
           enterkeyhint="search" autocomplete="off" autocapitalize="words" spellcheck="false" maxlength="80">
    <button type="button" class="citybar__here" data-city-here aria-label="Show the city I'm in">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3.5 3.8 10.6l7 2.6 2.6 7z"/></svg>
    </button>
  </form>
  <ul class="citybar__list" role="listbox" aria-label="Cities" hidden></ul>
</div>
