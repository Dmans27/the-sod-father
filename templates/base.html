<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}The Sod Father{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a href="/" class="site-brand">
        <span class="site-brand__mark">⛳</span>
        <span class="site-brand__text">The Sod Father</span>
      </a>
      <nav class="site-nav">
        <a href="/" class="site-nav__link {% if not active_category %}is-active{% endif %}">All</a>
        {% for key, cat in categories.items() %}
          <a href="/category/{{ key }}" class="site-nav__link {% if active_category == key %}is-active{% endif %}">{{ cat.label }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>

  <main class="site-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>The Sod Father &mdash; a fun side project, not a real publication (yet).</p>
  </footer>

  <script>
    // No-op on a regular browser visit -- window.Capacitor only exists when
    // this page is loaded inside the iOS app's native shell. There,
    // capacitor.config.ts turns off the splash screen's timer-based
    // auto-hide (Render's free tier can take 50s+ to wake from a cold
    // start, so a fixed timer would hide it too early or too late) and
    // this tells it to hide once the page has actually finished loading.
    // The setTimeout is a safety net so a slow or failed load event can
    // never leave the splash screen stuck on-screen forever.
    (function () {
      function hideSplash() {
        try {
          if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen) {
            window.Capacitor.Plugins.SplashScreen.hide();
          }
        } catch (e) {}
      }
      window.addEventListener('load', hideSplash);
      setTimeout(hideSplash, 8000);
    })();
  </script>
</body>
</html>
