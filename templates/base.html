<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}The Sod Father{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a href="/" class="site-brand">
        <span class="site-brand__mark">⛳</span>
        <span class="site-brand__text">The Sod Father</span>
      </a>
      <button type="button" class="site-menu-toggle" id="site-menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="site-menu-overlay">
        <span class="site-menu-toggle__bar"></span>
        <span class="site-menu-toggle__bar"></span>
        <span class="site-menu-toggle__bar"></span>
      </button>
    </div>
  </header>

  <!-- Hamburger drawer: replaces the old inline nav row (it used to wrap
       onto a second line on narrow screens, and sat right under the
       status bar in the iOS app). Same tabs, just tucked behind the menu
       button, same pattern as the other app. -->
  <div class="site-menu-overlay" id="site-menu-overlay" aria-hidden="true">
    <div class="site-menu-overlay__scrim" data-menu-close></div>
    <nav class="site-menu" aria-label="Categories">
      <div class="site-menu__header">
        <span class="site-menu__title">Browse</span>
        <button type="button" class="site-menu__close" data-menu-close aria-label="Close menu">&times;</button>
      </div>
      <a href="/" class="site-menu__link {% if not active_category %}is-active{% endif %}">All</a>
      {% for key, cat in categories.items() %}
        <a href="/category/{{ key }}" class="site-menu__link {% if active_category == key %}is-active{% endif %}">{{ cat.emoji }} {{ cat.label }}</a>
      {% endfor %}
    </nav>
  </div>

  <main class="site-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>The Sod Father &mdash; a fun side project, not a real publication (yet).</p>
  </footer>

  <script>
    // No-op on a regular browser visit -- window.Capacitor only exists when
    // this page is loaded inside the iOS app's native shell. There,
    // capacitor.config.ts turns off the splash screen's timer-based
    // auto-hide (Render's free tier can take 50s+ to wake from a cold
    // start, so a fixed timer would hide it too early or too late) and
    // this tells it to hide once the page has actually finished loading.
    // The setTimeout is a safety net so a slow or failed load event can
    // never leave the splash screen stuck on-screen forever.
    (function () {
      function hideSplash() {
        try {
          if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen) {
            window.Capacitor.Plugins.SplashScreen.hide();
          }
        } catch (e) {}
      }
      window.addEventListener('load', hideSplash);
      setTimeout(hideSplash, 8000);
    })();
  </script>

  <script>
    // Card-grid pages (the homepage and category pages) embed
    // window.ARTICLES_DATA / window.CATEGORIES_DATA and the sheet markup
    // from index.html. This no-ops harmlessly on any other page (the
    // article page, 404, etc.) where those don't exist.
    (function () {
      var overlay = document.getElementById('article-sheet-overlay');
      var inner = document.getElementById('article-sheet-inner');
      var grid = document.getElementById('card-grid');
      if (!overlay || !inner || !grid || !window.ARTICLES_DATA) return;

      var articlesBySlug = {};
      window.ARTICLES_DATA.forEach(function (a) { articlesBySlug[a.slug] = a; });

      var WORD_LIMIT = 150;

      function truncateParagraphs(paragraphs, limit) {
        var used = 0, out = [], truncated = false;
        for (var i = 0; i < paragraphs.length; i++) {
          var words = paragraphs[i].split(/\s+/);
          if (used + words.length <= limit) {
            out.push(paragraphs[i]);
            used += words.length;
          } else {
            var remaining = limit - used;
            if (remaining > 0) {
              out.push(words.slice(0, remaining).join(' ') + '…');
            } else if (out.length === 0) {
              out.push(words.slice(0, limit).join(' ') + '…');
            }
            truncated = true;
            break;
          }
        }
        return { paragraphs: out, truncated: truncated };
      }

      function paragraphsHtml(paragraphs) {
        return paragraphs.map(function (p) { return '<p>' + p + '</p>'; }).join('');
      }

      function renderSheet(article) {
        var cat = window.CATEGORIES_DATA[article.category] || {};
        var short = truncateParagraphs(article.body, WORD_LIMIT);

        inner.innerHTML =
          '<div class="article-sheet__hero" style="background: linear-gradient(135deg, ' + cat.color + ' 0%, ' + cat.color + 'cc 100%);">' +
            '<span class="article-sheet__hero-emoji">' + cat.emoji + '</span>' +
          '</div>' +
          '<div class="article-sheet__body">' +
            '<span class="article__pill">' + cat.label + '</span>' +
            '<h1 class="article__title">' + article.title + '</h1>' +
            '<p class="article__dek">' + article.dek + '</p>' +
            '<p class="article__meta">' + article.author + ' &middot; ' + article.published_at + ' &middot; ' + article.read_minutes + ' min read</p>' +
            '<div class="article__content" id="article-sheet-content">' + paragraphsHtml(short.paragraphs) + '</div>' +
            (short.truncated ? '<button type="button" class="article-sheet__readmore" id="article-sheet-readmore">Read more</button>' : '') +
          '</div>';

        if (short.truncated) {
          document.getElementById('article-sheet-readmore').addEventListener('click', function () {
            document.getElementById('article-sheet-content').innerHTML = paragraphsHtml(article.body);
            this.remove();
          });
        }
      }

      function openSheet(slug, opts) {
        var article = articlesBySlug[slug];
        if (!article) return;
        renderSheet(article);
        overlay.classList.add('is-open');
        overlay.setAttribute('aria-hidden', 'false');
        document.body.classList.add('article-sheet-open');
        if (!opts || opts.pushState !== false) {
          history.pushState({ articleSheet: slug }, '', '/article/' + slug);
        }
      }

      function closeSheet(opts) {
        overlay.classList.remove('is-open');
        overlay.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('article-sheet-open');
        if (!opts || opts.goBack !== false) {
          if (history.state && history.state.articleSheet) {
            history.back();
          }
        }
      }

      grid.addEventListener('click', function (e) {
        var link = e.target.closest('a.card[data-slug]');
        if (!link) return;
        e.preventDefault();
        openSheet(link.getAttribute('data-slug'));
      });

      Array.prototype.forEach.call(overlay.querySelectorAll('[data-sheet-close]'), function (el) {
        el.addEventListener('click', function () { closeSheet(); });
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && overlay.classList.contains('is-open')) closeSheet();
      });

      window.addEventListener('popstate', function () {
        if (overlay.classList.contains('is-open')) closeSheet({ goBack: false });
      });
    })();
  </script>

  <script>
    // Hamburger menu drawer, present on every page (it's in base.html, not
    // index.html) since the header is shared site-wide.
    (function () {
      var toggle = document.getElementById('site-menu-toggle');
      var overlay = document.getElementById('site-menu-overlay');
      if (!toggle || !overlay) return;

      function openMenu() {
        overlay.classList.add('is-open');
        overlay.setAttribute('aria-hidden', 'false');
        toggle.setAttribute('aria-expanded', 'true');
        document.body.classList.add('site-menu-open');
      }
      function closeMenu() {
        overlay.classList.remove('is-open');
        overlay.setAttribute('aria-hidden', 'true');
        toggle.setAttribute('aria-expanded', 'false');
        document.body.classList.remove('site-menu-open');
      }

      toggle.addEventListener('click', function () {
        if (overlay.classList.contains('is-open')) closeMenu(); else openMenu();
      });
      Array.prototype.forEach.call(overlay.querySelectorAll('[data-menu-close]'), function (el) {
        el.addEventListener('click', closeMenu);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && overlay.classList.contains('is-open')) closeMenu();
      });
    })();
  </script>
</body>
</html>
