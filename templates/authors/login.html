<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Author sign in — The Sod Father</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="admin-login-body">
  <main class="admin-login">
    <div class="admin-login__card">
      <div class="admin-login__brand">⛳ The Sod Father <span>write for us</span></div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <p class="{% if category == 'error' %}admin-login__error{% else %}admin-login__notice{% endif %}">{{ message }}</p>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post">
        <label class="admin-field">
          <span>Email</span>
          <input type="email" name="email" autofocus required>
        </label>
        <label class="admin-field">
          <span>Password</span>
          <input type="password" name="password" required>
        </label>
        <button type="submit" class="admin-btn admin-btn--primary admin-btn--block">Sign in</button>
      </form>
      <p class="admin-login__footnote">New writer? <a href="{{ url_for('author_auth.signup') }}">Create an account</a></p>
    </div>
  </main>
</body>
</html>
