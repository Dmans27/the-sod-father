{# Footprints (footprints.py, static/js/footprints.js): the "Worth the walk?" row of 1-5 footprints,
   and the walker score badge ("4.6 · 3 walkers"). Included on the walk page and the stories feed. #}
<style>
  .fprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; }
  .fprow__label { font-size: 13px; font-weight: 700; color: var(--fp-label, rgba(255, 255, 255, 0.7)); }
  .fprow__steps { display: flex; gap: 0; }
  .fprow__step { width: 36px; height: 36px; padding: 0; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    color: var(--fp-off, rgba(255, 255, 255, 0.22)); transition: color 0.15s, transform 0.15s; }
  .fprow__step svg { width: 24px; height: 24px; fill: currentColor; }
  .fprow__step.is-on { color: var(--fp-on, #9cc77f); }
  .fprow__step:active { transform: scale(0.88); }
  .fpbadge { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: var(--fp-on, #9cc77f); white-space: nowrap; text-transform: none; }
  .fpbadge svg { width: 14px; height: 14px; fill: currentColor; flex: none; }
</style>
<script src="/static/js/footprints.js?v=1" defer></script>
