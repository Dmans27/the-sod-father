{% extends "base.html" %}
{% block title %}Create account — The Sod Father{% endblock %}

{% block content %}
<section class="account-card">
  <h1 class="account-card__title">Create your account</h1>
  <p class="account-card__sub">Save stories to read later and join the conversation.</p>

  {% if error %}<p class="account-error" role="alert">{{ error }}</p>{% endif %}

  <form method="post" action="/account/signup" class="account-form">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <input type="hidden" name="then" value="{{ then }}">
    <label class="account-field">
      <span>Display name <em>shown next to your comments</em></span>
      <input type="text" name="display_name" value="{{ (form or {}).get('display_name', '') }}" maxlength="40" autocomplete="nickname" required autofocus>
    </label>
    <label class="account-field">
      <span>Email <em>never shown publicly</em></span>
      <input type="email" name="email" value="{{ (form or {}).get('email', '') }}" autocomplete="email" autocapitalize="off" required>
    </label>
    <label class="account-field">
      <span>Password <em>at least 8 characters</em></span>
      <input type="password" name="password" minlength="8" autocomplete="new-password" required>
    </label>
    <button type="submit" class="account-btn">Create account</button>
  </form>

  <p class="account-card__foot">Already have an account? <a href="/account/login?next={{ next|urlencode }}{% if then %}&then={{ then|urlencode }}{% endif %}">Sign in</a></p>
</section>
{% endblock %}
